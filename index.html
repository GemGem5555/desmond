<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:type" content="website">
<meta property="og:title" content="Desmond — Night Corp">
<meta property="og:description" content="Night Corp собрала его заново. Он благодарен. Он не помнит, за что. Cyberpunk 2077 RP bot.">
<meta property="og:image" content="https://gemgem5555.github.io/desmond/img/og.jpg">
<meta property="og:url" content="https://gemgem5555.github.io/desmond/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#06070b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2306070b'/%3E%3Cpath d='M6 5h12l8 8v14H6z' fill='none' stroke='%23fcee0a' stroke-width='3'/%3E%3C/svg%3E">
<style>body{margin:0}img{max-width:100%}</style>
<title>Desmond Dossier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Desmond — Cyberpunk 2077 roleplay bot. Personnel file, Night City lore and story paths.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700;800&family=Tektur:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Night Corp personnel file rendered as a Night City HUD.
   Yellow = interface (the game's UI color), neon red = Desmond / his past / warnings,
   cyan = the system (Kiroshi, CN-07). Cut corners, scanlines, RGB-split glitch. Single dark world. */
:root{
  --asphalt:#06070b;
  --panel:#0c0f16;
  --panel-2:#111622;
  --line:#2a3040;
  --ink:#eef1f6;
  --mute:#929bad;
  --faint:#5a6376;
  --yellow:#fcee0a;
  --red:#ff2a4f;
  --red-dim:#6e1426;
  --ice:#00f0ff;
  --ice-dim:#0d4f5a;
  --bar:#000;
  --display:"Tektur","Unbounded","Arial Black",system-ui,sans-serif;
  --cond:"Tektur","Arial Narrow",system-ui,sans-serif;
  --body:"Tektur",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --accent:var(--yellow);
  --cut:14px;
  color-scheme:dark;
}
body.sys{--accent:var(--ice)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--asphalt)}
body{background:var(--asphalt);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;letter-spacing:.005em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:
    radial-gradient(900px 600px at 100% -10%,rgba(255,42,79,.16),transparent 60%),
    radial-gradient(800px 600px at -10% 40%,rgba(0,240,255,.09),transparent 60%),
    linear-gradient(rgba(0,240,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,240,255,.035) 1px,transparent 1px);
  background-size:auto,auto,48px 48px,48px 48px;background-attachment:fixed}
body.sys{background-image:
    radial-gradient(900px 600px at 100% -10%,rgba(0,240,255,.16),transparent 60%),
    radial-gradient(800px 600px at -10% 40%,rgba(255,42,79,.07),transparent 60%),
    linear-gradient(rgba(0,240,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,240,255,.05) 1px,transparent 1px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--asphalt)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;mix-blend-mode:overlay;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
a{color:inherit}
::selection{background:var(--yellow);color:#000}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;position:relative;z-index:1}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.mono{font-family:var(--mono)}
.label{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

/* cut-corner panel: clip + drawn diagonal edges */
.cut{--bc:var(--line);--bgc:var(--panel);border:1px solid var(--bc);
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));
  background:
    linear-gradient(45deg,transparent calc(50% - .8px),var(--bc) calc(50% - .8px) calc(50% + .8px),transparent calc(50% + .8px)) right -1px top -1px/var(--cut) var(--cut) no-repeat,
    linear-gradient(45deg,transparent calc(50% - .8px),var(--bc) calc(50% - .8px) calc(50% + .8px),transparent calc(50% + .8px)) left -1px bottom -1px/var(--cut) var(--cut) no-repeat,
    var(--bgc)}

.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  padding:2px 8px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.tag.canon{border-color:var(--yellow);color:var(--yellow)}
.tag.author{border-color:var(--ice);color:var(--ice);box-shadow:0 0 8px rgba(0,240,255,.25)}
.tag.red{border-color:var(--red);color:var(--red)}

/* glitch text: data-text layers in red/cyan */
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;pointer-events:none}
.glitch::before{color:var(--ice);transform:translate(-2px,0);clip-path:inset(0 0 100% 0);animation:gA 4.6s infinite steps(1)}
.glitch::after{color:var(--red);transform:translate(2px,0);clip-path:inset(0 0 100% 0);animation:gB 4.6s infinite steps(1)}
@keyframes gA{0%,88%,100%{clip-path:inset(0 0 100% 0)}89%{clip-path:inset(12% 0 60% 0);transform:translate(-5px,0)}91%{clip-path:inset(55% 0 20% 0);transform:translate(4px,0)}93%{clip-path:inset(78% 0 4% 0);transform:translate(-3px,0)}}
@keyframes gB{0%,88%,100%{clip-path:inset(0 0 100% 0)}89%{clip-path:inset(40% 0 35% 0);transform:translate(5px,0)}91%{clip-path:inset(5% 0 80% 0);transform:translate(-4px,0)}94%{clip-path:inset(66% 0 12% 0);transform:translate(3px,0)}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(6,7,11,.9);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--yellow);box-shadow:0 1px 14px rgba(252,238,10,.15);
  margin:0 calc(-1*max(16px,env(safe-area-inset-right,0px))) 0 calc(-1*max(16px,env(safe-area-inset-left,0px)))}
body.sys .top{border-bottom-color:var(--ice);box-shadow:0 1px 14px rgba(0,240,255,.2)}
.top .wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.2em;text-decoration:none;display:flex;align-items:center;gap:10px;color:var(--yellow);text-shadow:0 0 10px rgba(252,238,10,.5)}
body.sys .brand{color:var(--ice);text-shadow:0 0 10px rgba(0,240,255,.6)}
.brand small{font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.12em;color:var(--faint);text-shadow:none}
nav.links{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.links a{font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--mute);padding:5px 14px;
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
nav.links a:hover{color:var(--yellow);background:rgba(252,238,10,.08)}
nav.links a[aria-current="page"]{color:#000;background:var(--yellow)}
nav.links a.locked{color:var(--red);text-shadow:0 0 8px rgba(255,42,79,.5)}
nav.links a.sysl{color:var(--ice)}
nav.links a.sysl[aria-current="page"]{background:var(--ice);color:#001417}
.lang{display:flex;border:1px solid var(--line)}
.lang button{all:unset;cursor:pointer;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;padding:5px 9px;color:var(--mute)}
.lang button[aria-pressed="true"]{background:var(--red);color:#fff}
.lang button:focus-visible{outline:2px solid var(--accent)}

/* ticker */
.ticker{position:relative;z-index:1;overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--line);
  margin:0 calc(-1*max(16px,env(safe-area-inset-right,0px))) 0 calc(-1*max(16px,env(safe-area-inset-left,0px)));
  background:repeating-linear-gradient(135deg,rgba(252,238,10,.06) 0 10px,transparent 10px 20px),#08090d}
.ticker .run{display:inline-flex;gap:0;padding:6px 0;animation:run 48s linear infinite;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow)}
.ticker .run span{padding-right:48px}
.ticker .run span:nth-child(3n+2){color:var(--ice)}
.ticker .run span:nth-child(3n){color:var(--red)}
@keyframes run{to{transform:translateX(-50%)}}

main{padding-block:44px 72px}
main.jolt{animation:jolt .32s steps(2)}
@keyframes jolt{0%{filter:drop-shadow(4px 0 0 rgba(255,42,79,.7)) drop-shadow(-4px 0 0 rgba(0,240,255,.7));transform:translateX(3px)}50%{filter:drop-shadow(-3px 0 0 rgba(255,42,79,.6)) drop-shadow(3px 0 0 rgba(0,240,255,.6));transform:translateX(-2px)}100%{filter:none;transform:none}}
section+section{margin-top:76px}
.sechead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:28px;position:relative;border-bottom:1px solid var(--line)}
.sechead::after{content:"";position:absolute;left:0;bottom:-1px;width:120px;height:3px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.sechead::before{content:"//";font-family:var(--mono);color:var(--accent);font-size:16px}
.sechead h2{font-family:var(--display);font-weight:800;font-size:clamp(20px,3vw,30px);letter-spacing:.04em;text-transform:uppercase}
.sechead .label{margin-left:auto}
.lead{font-size:18px;line-height:1.65;max-width:62ch;color:var(--ink)}
.prose{max-width:66ch;display:grid;gap:14px;color:#c9cfda}
.prose strong{color:var(--yellow);font-weight:600}

/* redaction */
.rd{position:relative;display:inline-block;vertical-align:-0.15em;height:1.1em;width:var(--w,8ch);background:var(--bar);
  box-shadow:0 0 0 1px #000,inset 0 0 0 1px #1a1d25;cursor:help;outline-offset:2px}
.rd .rd-in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-size:11px;letter-spacing:.12em;color:transparent;transition:color .15s;white-space:nowrap;overflow:hidden}
.rd:hover .rd-in,.rd:focus .rd-in,.rd.open .rd-in{color:#4f5768}

/* image treatment: HUD frame + hover RGB split */
.hud{position:relative;margin:0;max-width:100%}
.hud img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.hud img[src*="standing"]{object-position:50% 0}
.hud::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:
    linear-gradient(var(--yellow),var(--yellow)) left top/22px 2px no-repeat,
    linear-gradient(var(--yellow),var(--yellow)) left top/2px 22px no-repeat,
    linear-gradient(var(--yellow),var(--yellow)) right bottom/22px 2px no-repeat,
    linear-gradient(var(--yellow),var(--yellow)) right bottom/2px 22px no-repeat,
    repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.hud.ice::before{background:
    linear-gradient(var(--ice),var(--ice)) left top/22px 2px no-repeat,
    linear-gradient(var(--ice),var(--ice)) left top/2px 22px no-repeat,
    linear-gradient(var(--ice),var(--ice)) right bottom/22px 2px no-repeat,
    linear-gradient(var(--ice),var(--ice)) right bottom/2px 22px no-repeat,
    repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.hud.redf::before{background:
    linear-gradient(var(--red),var(--red)) left top/22px 2px no-repeat,
    linear-gradient(var(--red),var(--red)) left top/2px 22px no-repeat,
    linear-gradient(var(--red),var(--red)) right bottom/22px 2px no-repeat,
    linear-gradient(var(--red),var(--red)) right bottom/2px 22px no-repeat,
    repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.hud:hover img{animation:rgb .5s steps(2) 1}
@keyframes rgb{0%{filter:drop-shadow(5px 0 0 rgba(255,42,79,.8)) drop-shadow(-5px 0 0 rgba(0,240,255,.8))}50%{filter:drop-shadow(-3px 0 0 rgba(255,42,79,.7)) drop-shadow(3px 0 0 rgba(0,240,255,.7)) saturate(1.4)}100%{filter:none}}
.scan{position:absolute;left:0;right:0;height:60px;top:-60px;z-index:2;pointer-events:none;
  background:linear-gradient(transparent,rgba(0,240,255,.16),transparent);animation:scan 5s linear infinite}
@keyframes scan{to{top:100%}}

/* HOME */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:end}
.hero .text{display:grid;gap:22px;padding-bottom:12px;min-width:0}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(48px,9.5vw,116px);line-height:.88;letter-spacing:.02em;
  text-transform:uppercase;color:var(--yellow);text-shadow:0 0 18px rgba(252,238,10,.45),0 0 2px rgba(252,238,10,.9)}
.hero h1 .glitch::before,.hero h1 .glitch::after{text-shadow:none}
.hero .tagline{font-family:var(--cond);font-weight:500;font-size:clamp(21px,2.4vw,27px);line-height:1.35;max-width:30ch;color:var(--ink)}
.hero .tagline em{font-style:normal;color:var(--red);text-shadow:0 0 6px rgba(255,42,79,.9),0 0 22px rgba(255,42,79,.55);animation:flick 6s infinite}
@keyframes flick{0%,18%,22%,62%,64%,100%{opacity:1}19%,21%,63%{opacity:.35;text-shadow:none}}
.metaRow{display:flex;gap:8px;flex-wrap:wrap}
.metaRow .tag:first-child{background:var(--yellow);color:#000;border-color:var(--yellow);font-weight:500}
.hero .hud{aspect-ratio:2/3;max-height:660px;border:1px solid var(--line);overflow:hidden;box-shadow:0 0 40px rgba(255,42,79,.18)}
.hero .hud figcaption{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:10px 14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--yellow);background:linear-gradient(transparent,rgba(0,0,0,.9))}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{--bgc:var(--panel);padding:22px 20px 20px;text-decoration:none;display:grid;gap:10px;align-content:start;min-height:180px;transition:transform .15s}
.tile:hover{--bc:var(--yellow);--bgc:var(--panel-2);transform:translateY(-2px)}
.tile .num{font-family:var(--mono);font-size:11px;color:var(--yellow);letter-spacing:.14em}
.tile h3{font-family:var(--display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.05em}
.tile:hover h3{color:var(--yellow);text-shadow:0 0 10px rgba(252,238,10,.5)}
.tile p{color:var(--mute);font-size:14.5px;line-height:1.5}
.tile.lockedTile{--bc:var(--red-dim)}
.tile.lockedTile .num{color:var(--red)}
.tile.lockedTile h3{color:var(--red);text-shadow:0 0 10px rgba(255,42,79,.5)}
.tile.lockedTile:hover{--bc:var(--red)}
.tile.sysTile{--bc:var(--ice);--bgc:#061a1f}
.tile.sysTile .num,.tile.sysTile h3{color:var(--ice);text-shadow:0 0 10px rgba(0,240,255,.5)}
.warn{--bc:var(--red);--bgc:#12070b;padding:24px;display:grid;gap:14px;position:relative}
.warn .hz{height:8px;margin:-24px -24px 6px;background:repeating-linear-gradient(135deg,var(--yellow) 0 12px,#000 12px 24px)}
.warn .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.warn .age{font-family:var(--display);font-weight:800;font-size:30px;color:var(--red);text-shadow:0 0 14px rgba(255,42,79,.7)}
.warn ul{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.warn li{font-family:var(--mono);font-size:12px;border:1px solid var(--red-dim);padding:4px 9px;color:var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}

/* DOSSIER */
.file{--bc:var(--yellow);--bgc:var(--panel);--cut:20px}
.fileHead{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 24px 12px 20px;background:var(--yellow);color:#000}
.fileHead .label{color:#000;font-weight:500}
.fileHead .stamp{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#000;border:1px solid #000;padding:2px 8px}
.fileBody{display:grid;grid-template-columns:280px minmax(0,1fr);gap:0}
.fileBody .photo{border-right:1px solid var(--line);padding:20px;display:grid;gap:14px;align-content:start}
.fileBody .photo .hud{aspect-ratio:1;border:1px solid var(--line)}
.fields{padding:20px 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px;align-content:start}
.field{display:grid;gap:3px;min-width:0}
.field .label{color:var(--yellow)}
.field .v{font-size:15.5px}
.field.wide{grid-column:1/-1}
.blk{padding:22px}
.blk .sechead::before{content:none}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.eval{display:grid;gap:0}
.eval .item{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;padding:16px 0;border-top:1px solid var(--line)}
.eval .item:first-child{border-top:0;padding-top:0}
.eval h3{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.eval p{color:#c9cfda}
.score{display:flex;gap:3px;margin-top:8px}
.score i{width:16px;height:6px;background:var(--line);transform:skewX(-20deg)}
.score i.on{background:var(--yellow);box-shadow:0 0 6px rgba(252,238,10,.6)}
table.spec{width:100%;border-collapse:collapse;font-size:14.5px}
table.spec th,table.spec td{text-align:left;padding:10px 12px 10px 0;border-top:1px solid var(--line);vertical-align:top}
table.spec th{font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--yellow);white-space:nowrap;width:1%}
table.spec td{color:#c9cfda}
.tblwrap{overflow-x:auto}
.quotes{display:grid;gap:12px}
.quotes blockquote{margin:0;padding:10px 0 10px 16px;border-left:2px solid var(--red);box-shadow:-6px 0 12px -8px var(--red);font-family:var(--cond);font-size:19px;color:var(--ink)}
.quotes cite{display:block;font-style:normal;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.1em;margin-top:4px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.strip figure{margin:0;display:grid;gap:8px}

.strip .hud{aspect-ratio:2/3;border:1px solid var(--line);overflow:hidden}
.strip figcaption{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.06em}
.cap-egg{all:unset;cursor:pointer;display:inline-flex;vertical-align:-3px;margin-left:6px;color:#2f5f9e;opacity:.45;transition:opacity .2s}
.cap-egg:hover,.cap-egg:focus-visible{opacity:1;outline:1px dashed #2f5f9e;outline-offset:3px}

/* BREACH */
.breach{--bc:var(--red);--bgc:#090509;--cut:22px;padding:30px 26px;display:grid;gap:20px;justify-items:start;position:relative;overflow:hidden}
.breach::after{content:"";position:absolute;right:-40px;top:0;bottom:0;width:45%;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,transparent 0 22px,rgba(255,42,79,.06) 22px 23px),
  linear-gradient(90deg,transparent,rgba(255,42,79,.08))}
.breach .bhead{display:grid;gap:6px;position:relative;z-index:1}
.breach h2{font-family:var(--display);font-weight:800;font-size:clamp(22px,3.4vw,32px);text-transform:uppercase}
.gl{all:unset;cursor:pointer;font-family:var(--display);font-weight:800;font-size:clamp(18px,3vw,24px);letter-spacing:.14em;text-transform:uppercase;
  padding:16px 30px;background:var(--yellow);color:#000;position:relative;z-index:1;box-shadow:0 0 24px rgba(252,238,10,.35);
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
.gl:hover{background:#fff35a;box-shadow:0 0 34px rgba(252,238,10,.6)}
.gl:focus-visible{outline:3px solid var(--ice);outline-offset:4px}
.gl span{position:relative;display:inline-block;animation:glitch 3.2s infinite steps(1)}
.gl.sysgo{background:var(--ice);box-shadow:0 0 24px rgba(0,240,255,.4)}
@keyframes glitch{
  0%,86%,100%{transform:none;text-shadow:none;clip-path:none}

  89%{transform:translate(3px,1px);text-shadow:-2px 0 var(--ice),2px 0 var(--red);clip-path:inset(60% 0 5% 0)}
  91%{transform:translate(-1px,-1px);text-shadow:2px 0 var(--ice);clip-path:none}
  93%{transform:none;text-shadow:-3px 0 var(--red)}
}
.bp{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;position:relative;z-index:1;align-items:start}
.bp .rules{grid-column:1/-1;font-size:14.5px;color:#c9cfda;max-width:72ch}
.bp .rules b{color:var(--yellow);font-weight:600}
.mxwrap{display:grid;gap:10px}
.mxhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow)}
.mxhead .tm{color:var(--ice);font-variant-numeric:tabular-nums}
.mxhead .tm.low{color:var(--red)}
.mx{display:grid;grid-template-columns:repeat(5,52px);grid-auto-rows:46px;gap:4px;padding:10px;border:1px solid var(--yellow);background:#0b0b05;box-shadow:0 0 18px rgba(252,238,10,.12)}
.mx button{all:unset;display:grid;place-items:center;font-family:var(--mono);font-size:17px;font-weight:500;letter-spacing:.06em;color:#d9e19a;cursor:default;position:relative}
.mx button.line{background:rgba(252,238,10,.09)}
.mx button.ok{cursor:pointer;color:var(--yellow)}
.mx button.ok:hover,.mx button.ok:focus-visible{background:var(--yellow);color:#000;outline:none;box-shadow:0 0 14px rgba(252,238,10,.6)}
.mx button.used{color:transparent}
.mx button.used::after{content:"[ ]";position:absolute;color:#4a4a2a;font-size:14px}
.side{display:grid;gap:18px;min-width:0;align-content:start}
.bufrow{display:flex;gap:6px;flex-wrap:wrap}
.bufrow span{width:44px;height:40px;display:grid;place-items:center;border:1px dashed #5c5711;font-family:var(--mono);font-size:15px;color:var(--yellow);background:#000}
.bufrow span.f{border-style:solid;border-color:var(--yellow);box-shadow:0 0 8px rgba(252,238,10,.3)}
.daemon{--bc:var(--ice-dim);--bgc:#061317;padding:14px 16px;display:grid;gap:10px}
.daemon .dn{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ice)}
.daemon .seq{display:flex;gap:8px}
.daemon .seq span{font-family:var(--mono);font-size:17px;width:44px;height:36px;display:grid;place-items:center;border:1px solid var(--ice-dim);color:#7fb7bf}
.daemon .seq span.m{background:var(--ice);color:#001417;border-color:var(--ice);box-shadow:0 0 10px rgba(0,240,255,.5)}
.daemon.done{--bc:var(--ice)}
.bpout{font-family:var(--mono);font-size:14px;display:grid;gap:4px;min-height:1.6em;color:var(--mute)}
.bpout .ok{color:var(--ice);text-shadow:0 0 8px rgba(0,240,255,.6)}
.bpout .bad{color:var(--red);text-shadow:0 0 8px rgba(255,42,79,.6)}
.retry{all:unset;cursor:pointer;justify-self:start;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:8px 14px;border:1px solid var(--yellow);color:var(--yellow)}
.retry:hover{background:var(--yellow);color:#000}
.retry:focus-visible{outline:2px solid var(--ice)}
@media (max-width:640px){
  .bp{grid-template-columns:minmax(0,1fr)}
  .mx{grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:44px;max-width:320px}
}

/* TRUTH */
.sysHead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr);gap:36px;align-items:center}
.sysHead h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,68px);line-height:.95;text-transform:uppercase;color:var(--ice);

.traits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.traits h3{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);text-shadow:0 0 8px rgba(255,42,79,.5)}

.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pair .hud{aspect-ratio:3/4;border:1px solid var(--red-dim);overflow:hidden}
.seg{display:inline-flex;border:1px solid var(--line);margin-bottom:18px}
.seg button{all:unset;cursor:pointer;font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;padding:8px 20px;color:var(--mute)}
.seg button[aria-pressed="true"].b{background:var(--red);color:#fff;box-shadow:0 0 16px rgba(255,42,79,.5)}
.seg button[aria-pressed="true"].a{background:var(--ice);color:#001417;box-shadow:0 0 16px rgba(0,240,255,.5)}
.seg button:focus-visible{outline:2px solid var(--yellow);outline-offset:-2px}
.ba{--bgc:var(--panel);padding:4px 0}
.ba.before{--bc:var(--red)}
.ba.after{--bc:var(--ice)}
.ba .r{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;padding:14px 20px;border-top:1px solid var(--line)}
.ba .r:first-child{border-top:0}
.ba .r h3{font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}

.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.chain div{--bc:var(--ice-dim);--bgc:#061317;padding:18px;display:grid;gap:8px;align-content:start;position:relative}
.chain h3{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.06em;color:var(--ice);text-shadow:0 0 8px rgba(0,240,255,.5)}
.chain p{font-size:14.5px;color:#c9cfda}
.chain .ar{font-family:var(--mono);font-size:11px;color:var(--ice);letter-spacing:.1em}
ol.stages{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ol.stages li{--bc:var(--line);--bgc:var(--panel);display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:18px;align-items:start;padding:16px 20px}

.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.live{border-color:var(--ice);color:#001417;background:var(--ice);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.55}}
.edits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.edits div{--bgc:var(--panel);padding:16px;display:grid;gap:8px;align-content:start}
.edits h3{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--yellow)}
.edits p{font-size:14px;color:#c9cfda}
.edits .ex{font-family:var(--mono);font-size:12.5px;color:var(--ice)}
.intr{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:32px;align-items:start}
.intr figure{margin:0}
.intr .hud{border:1px solid var(--red-dim);overflow:hidden}
.intr ul{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.intr li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.intr li b{font-weight:600;color:var(--red)}
.intr li span{color:#c9cfda}
.axes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.axes div{--bc:var(--ice-dim);--bgc:#061317;padding:16px;display:grid;gap:8px;align-content:start}
.axes h3{font-family:var(--cond);font-weight:600;font-size:16px;letter-spacing:.06em;color:var(--ice)}
.axes p{font-size:14.5px;color:#c9cfda}
.sealed{--bc:var(--yellow);--bgc:#0d0c05;padding:20px;display:grid;gap:10px;max-width:720px}
.sealed .label{color:var(--yellow)!important}
.relock{all:unset;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--faint);text-decoration:underline}

/* LORE */
.filter{display:flex;gap:10px;align-items:center;border:1px solid var(--yellow);background:#0b0b06;padding:0 12px;max-width:460px;margin-bottom:32px;box-shadow:0 0 14px rgba(252,238,10,.12)}
.filter input{all:unset;flex:1;min-width:0;padding:11px 0;font-size:15px}
.filter input::placeholder{color:var(--faint)}
.lg>h3.label{color:var(--yellow)!important}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{--bgc:var(--panel);padding:18px;display:grid;gap:8px;align-content:start;transition:transform .15s}
.card:hover{--bc:var(--yellow);transform:translateY(-2px)}
.card .h{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.card h3{font-family:var(--cond);font-weight:600;font-size:17.5px;letter-spacing:.02em}
.card p{font-size:14.5px;color:#c9cfda}
.card p .tag,.prose .tag{vertical-align:1px;margin-right:2px}
.slang{width:100%;border-collapse:collapse;font-size:14.5px}
.slang td{padding:9px 14px 9px 0;border-top:1px solid var(--line);vertical-align:top}
.slang td:first-child{font-family:var(--mono);color:var(--yellow);white-space:nowrap}
.slang td:nth-child(2){font-family:var(--mono);color:var(--ice);white-space:nowrap}
.slang td:last-child{color:#c9cfda}
.empty{color:var(--faint);font-family:var(--mono);font-size:13px}

/* PATHS */
.paths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.path{--bgc:var(--panel);--cut:18px;display:grid;grid-template-rows:auto 1fr;transition:transform .15s}
.path:hover{transform:translateY(-2px)}
.path .ph{display:flex;gap:18px;align-items:center;padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.path .ico{width:66px;height:66px;flex:none;display:grid;place-items:center;border:1px solid currentColor;background:#000;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}

.path .code{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--faint)}
.path h3{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.path .pb{padding:18px 20px 22px;display:grid;gap:14px;align-content:start}
.path .hook{font-family:var(--cond);font-size:18px;color:var(--ink);line-height:1.45}
.path dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0;font-size:14.5px}
.path dt{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding-top:2px}

.path .tags{display:flex;gap:6px;flex-wrap:wrap}
.path.p1{--bc:var(--ice-dim)} .path.p1 .ico,.path.p1 h3{color:var(--ice)} .path.p1:hover{--bc:var(--ice)}
.path.p2{--bc:var(--red-dim)} .path.p2 .ico,.path.p2 h3{color:var(--red)} .path.p2:hover{--bc:var(--red)}
.path.p3{--bc:#24406a} .path.p3 .ico,.path.p3 h3{color:#5aa2ff} .path.p3:hover{--bc:#5aa2ff}
.path.p4{--bc:#5c5711} .path.p4 .ico,.path.p4 h3{color:var(--yellow)} .path.p4:hover{--bc:var(--yellow)}

.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

footer{border-top:1px solid var(--line);padding-block:24px 40px;color:var(--faint);font-size:13px;position:relative;z-index:1}

      {t:'Город',items:[
        ['Найт-Сити','canon','Самоуправляемый корпоративный мегаполис на побережье Свободного штата Северная Калифорния, около 7,5 млн человек. Мэр и совет есть, но инфраструктура принадлежит корпорациям, они же платят полиции и политикам. Ниже корпоративной черты правит уличное правосудие. Кислотный дождь, смог, неон круглые сутки.'],
        ['НСША','canon','Новые Соединённые Штаты: остаток старых США на востоке и в центре континента. Калифорния вне федерального контроля. Президент Майерс, бывший член совета Militech, давит на воссоединение. В Найт-Сити НСША чувствуются в основном через Militech.'],
        ['Экстерриториальность','canon','Корпорации ведут себя как государства. Территория корпорации — иностранная земля: городской закон заканчивается на пороге. У корпораций свои армии, суды и службы безопасности, своих сотрудников они «полицейят» сами.'],
        ['Эдди и фиксеры','canon','Евродоллар, «эдди», — основная валюта. Фиксеры держат серый рынок: сводят клиентов с наёмниками, нетраннерами и громилами, назначают цену, у каждого своя территория.'],
        ['Холокост 2023','canon','20 августа 2023 года ударная группа при поддержке Militech подорвала башню Арасаки тактическим ядерным зарядом. Погибли тысячи. На Корпо-плаза стоит мемориал, новая башня Арасаки выросла на том же месте.'],
      ]},
      {t:'Районы',items:[
        ['Уотсон · Нортсайд','canon','«Плохой район». Нортсайд — промзона: склады, заводы, мёртвые цеха. Территория Мальстрёма, логова мусорщиков. Рядом Кабуки с рынками дешёвого хрома и Маленький Китай. <span class="tag author">авторский лор</span> Здесь вырос Десмонд.'],
        ['Центр · Корпо-плаза','canon','Стеклянные башни, частные КПП, камеры на каждом углу. Штаб-квартиры Night Corp, Militech и Арасаки. Уличной преступности будто нет: корпоративная охрана решает всё тихо и внутри.'],
        ['Хейвуд','canon','Латиноамериканский район, дом Валентино. Глен — мэрия, офисы и дорогие квартиры. Виста-дель-Рей — беднее и старше, муралы, семьи, которые живут тут поколениями. Корпоративная застройка выдавливает старых жильцов. <span class="tag author">авторский лор</span> В Глене живёт Десмонд.'],
        ['Уэстбрук','canon','Сюда приходят тратить деньги. Джапантаун с неоном и клубами, улица Джиг-Джиг под Тигриными когтями, Чартер-Хилл, особняки Норт-Оука.'],
        ['Санто-Доминго','canon','Один из старейших районов: заводы, электростанции, перенаселённые мегабашни. Корпорации используют его как полигон. Территория Шестой улицы.'],
        ['Пасифика и Догтаун','canon','Брошенный курорт: недостроенные отели, пустые бассейны. Держат Вудуисты, полиция не патрулирует. Внутри — Догтаун, огороженный анклав под властью ополчения «Баргест».'],
        ['Пустоши','canon','Сухие равнины за городом: горящие нефтяные поля, заброшенные посёлки, кланы кочевников. Закона нет, кланы следят за собой сами.'],
      ]},
      {t:'Night Corp',items:[
        ['Публичное лицо','canon','Корпорация, построенная на наследии Ричарда Найта, основателя города, убитого в 1998-м. Градостроительство, инфраструктура, транспортные проекты вроде маглева. Подаёт себя как корпорацию, которая работает на город.'],
        ['Репутация','author','Тихая, скрытная, подозрительно близка к мэрии. Слухи о людях, которые «сами на себя не похожи», о невидимых исследованиях ИИ, о слишком хорошей слежке. Ни один не подтвердился. Сотрудники говорят о компании с подозрительно ровной лояльностью.'],
        ['Служба безопасности','author','Тактическое крыло — полевые силовики: извлечения, подавление утечек, грязная работа, группы по 4–6 человек. Внутренняя безопасность расследует своих: утечки, кражи, проверки лояльности, допросы. Следователи работают парами, медицинские файлы закрыты высоким допуском.'],
        ['Отдел особых мер','author','Подразделение внутренней безопасности для «жёстких допросов». Руководит Юджин Хейл. Комнаты на минус четвёртом этаже башни: привинченные столы, кольца для наручников, слив в полу. Оттуда выходят не все.'],
        ['Рейд на маглев','canon','В одной из концовок основного сюжета (миссия «Forward to Death») кочевники-Альдекальдо во главе с Солом Брайтом и Панам Палмер в 2077 году атакуют стройку маглев-туннеля Night Corp в Пустошах. Стройку охраняет Militech. <span class="tag author">авторский лор</span> Среди охраны были несколько полевиков Night Corp, а вражеский нетраннер прошёлся по их имплантам. Десмонд был среди раненых.'],
      ]},
      {t:'Банды',items:[
        ['Мальстрём','canon','Банда экстремальной модификации в Нортсайде. Несколько оптик, светодиоды на лице, конечности ради вида. Культ хрома, разрушения и зрелища, страх как валюта. Опорный пункт — заброшенный завод «Олл Фудс».'],
        ['Мусорщики','canon','Разрозненные ячейки, которые похищают людей и разбирают их на импланты и органы. Ни территории, ни кодекса. Часто жертва в сознании. Некоторые используют приманку: дружелюбное лицо, секс-работницу, фальшивую работу.'],
        ['Валентино','canon','Крупнейшая банда города, корни в Хейвуде. Золотой хром, католические символы, лоурайдеры, кодекс семьи и уважения. Виста-дель-Рей принадлежит им. Корпоративным значкам там не рады.'],
        ['Тигриные когти','canon','Японская банда, правит Джапантауном. Быстрые байки, катаны, светящиеся татуировки. Клубы, азарт, секс-индустрия, «кукольные дома», где работниц переписывают чипами.'],
        ['Мокс','canon','Банда взаимной защиты секс-работниц и их союзников. База — «Бар Лиззи» в Кабуки. Защищают своих от Когтей, Мальстрёма и клиентов, которые считают людей товаром.'],
        ['Шестая улица','canon','Банда ветеранов в Санто-Доминго. Начиналась как дружина. Флаги, риторика защиты района, военная дисциплина и обычный бандитский бизнес.'],
        ['Животные','canon','Сила как идентичность. Вместо хрома — стимуляторы, гормоны, пересадка мышц. Нанимаются вышибалами, коллекторами и бойцами.'],
        ['Вудуисты','canon','Гаитянский коллектив нетраннеров в Пасифике, одни из лучших в городе. Ищут контакт с ИИ за Чёрным заслоном, поэтому в открытой войне с Сетевым дозором.'],
      ]},
      {t:'Хром и сеть',items:[
        ['Хром и рипердоки','canon','Хром — это класс. Тяжёлое видимое железо — улица, армия или отчаяние. Тонкие дорогие импланты — деньги. Рипердоки ставят хром без лицензии, за нал и без вопросов. Корпоративные клиники дороже и отчитываются обо всём.'],
        ['Kiroshi','canon','Японский производитель и лидер рынка кибер-глаз. На улице «кироши» называют любую оптику. <span class="tag author">авторский лор</span> Корпоративная оптика от работодателя идёт с фирменным софтом, обслуживается только в клиниках компании и требует регулярной калибровки.'],
        ['Берсерк','canon','Боевая операционная система. Заливает тело стимуляторами и выжимает мышцы и броню за пределы нормы. Потом трясёт и опустошает. Любим силовиками и Мальстрёмом. <span class="tag author">авторский лор</span> Частое использование связывают с киберпсихозом.'],
        ['Нетраннинг','canon','Прямое подключение к сети через кибердеку и нейропорт. ICE защищает данные, демоны атакуют, квикхаки бьют в реальном времени: ослепляют оптику, перегревают импланты, жгут нервную систему. Враждебный раннер может выжечь цели интерфейс и глаза издалека.'],
        ['Брейнданс','canon','Запись полного ощущения: зрение, звук, осязание, эмоции. Легальный BD — огромная индустрия, XBD с насилием запрещён и доступен везде. <span class="tag author">авторский лор</span> Сырая, неотредактированная запись ощущается плоской и пересвеченной.'],
        ['Киберпсихоз','canon','Распад личности из-за избытка или плохой интеграции хрома. Эмпатия и контроль импульсов разрушаются. Не лечится. Активные случаи забирает МаксТак. <span class="tag author">авторский лор</span> Хромированного мужика, который странно себя ведёт, сначала подозревают, а потом лечат.'],
        ['Чёрный заслон','canon','Барьер Сетевого дозора между человеческой сетью и дикими ИИ, которые развились в руинах старой сети после ДатаКраша 2022 года. Что за ним, толком не знает никто.'],
      ]},
      {t:'Люди вокруг Десмонда',items:[
        ['Юджин Хейл','author','Глава отдела особых мер, бывший командир группы, где служил Десмонд. Садист под контролем: холодный, методичный, никогда не повышает голос. Прежнего Десмонда побаивался. Нового подкалывает за «размякание».'],
        ['Тито Рейес','author','Полевик тактического крыла, годами служил с Десмондом. Ведомый по натуре: прежний Десмонд был его вожаком. До сих пор подкидывает старые реплики и ждёт старых ответов. Золотой клык, жвачный табак, смеётся слишком громко.'],
        ['Глитч','author','Мальстрёмовец, друг детства Десмонда, насколько в Нортсайде бывают друзья. Стальная челюсть, три красные оптики. Зовёт Десмонда «Рус». Узнаёт его с первого взгляда. Десмонд его не помнит вообще.'],
        ['Роман Коваль','author','Отец Десмонда, 54. Русский мигрант, до сих пор с мусорщиками, теперь скорее скупщик. Пьёт, громко смеётся, бьёт без предупреждения. Отец и сын не разговаривают годами.'],
        ['Мама Уэллс · El Coyote Cojo','canon','Бар в Хейвуде, почти нейтральная территория. Мама Уэллс тёплая со своими и беспощадна к тем, кто не уважает её место. <span class="tag author">авторский лор</span> С одной ночи 2076 года людей Night Corp на порог не пускает. Почему, не обсуждает.'],
        ['Мистер Голубоглазый','canon','Человек в дорогом костюме, глаза со слабым неестественным голубым свечением. Появляется рядом с делом Пералесов и в других сюжетах игры. Кто он и на кого работает, игра не раскрывает. <span class="tag author">авторский лор</span> Среди фиксеров и нетраннеров говорят, что через его глаза смотрит кто-то ещё.'],
      ]},
    ],
    slangT:'Сленг',
    slang:[
      ['choom','чумба','друг, свой'],['gonk','гонк','идиот'],['preem','прем','высший класс'],['nova','нова','круто'],['delta','дельта','свалить'],
      ['flatline','флэтлайн','убить, умереть'],['chrome','хром','импланты'],['iron','ствол','оружие'],['ripperdoc','рипердок','хирург по хрому'],
      ['eddies','эдди','деньги'],['gig','заказ','работа'],['fixer','фиксер','посредник'],['merc','наёмник','наёмник'],['solo','соло','боевик'],
      ['netrunner','нетраннер','хакер'],['corpo','пиджак','корпоративный'],['fry','поджарить','выжечь взломом'],['jack in','подключиться','войти в сеть'],
    ]
  },
  paths:{
    title:'Пути',
    lead:'Три готовые завязки и одна пустая. В каждой ты приходишь к Десмонду со своей стороны, и каждая давит на него по-своему.',
    code:'ВАРИАНТ',
    list:[
      {cls:'p1',icon:'cup',name:'Напарница',hook:'Ночная смена на этаже внутренней безопасности. Он приносит тебе кофе, ровно такой, как ты любишь, и просит пробить его закрытую медкарту.',
       dl:[['Кто ты','Новая напарница по ночным сменам. С допуском выше, чем у него.'],['Решаешь ты','Ты просто коллега, которой можно доверять, или наблюдатель, которому невыгодно, чтобы он вспомнил.'],['Тон','Медленное напряжение, офисная паранойя, близость под камерами.']],
       tags:['офис','тайна','slow burn']},
      {cls:'p2',icon:'cuffs',name:'Задержанная',hook:'Ты взломала закрытый контур Night Corp и попалась. Минус четвёртый этаж, слив в полу. Допрашивает тебя Десмонд, и времени у него до рассвета.',
       dl:[['Кто ты','Нарушитель, которого взяли на попытке выкачать данные.'],['Решаешь ты','На кого ты работаешь, что искала и знаешь ли ты про эксперимент.'],['Тон','Острый. Допрос для него самое сильное место сбоев. Если имени не будет, придёт Хейл.']],
       tags:['допрос','опасность','dark']},
      {cls:'p3',icon:'cap',name:'Сестра',hook:'Ночью в твою дверь в Виста-дель-Рей стучит огромный корпорат. В руке у него синяя кепка твоего брата. Он говорит, что не помнит, откуда она у него.',
       dl:[['Кто ты','Сестра парня, которого застрелили возле бара в Хейвуде. Дело закрыли как самооборону.'],['Решаешь ты','Что ты знаешь о той ночи и что сделаешь с человеком, который пришёл с кепкой.'],['Тон','Горе, недоверие, расследование. Самый прямой путь к его прошлому.']],
       tags:['прошлое','расследование','драма']},
      {cls:'p4',icon:'cursor',name:'Свой путь',hook:'Пустое первое сообщение. Начни сцену сам: где вы встретились и кем ты ему приходишься.',
       dl:[['Зацепки','Бар, куда не пускают корпоратов. Пустая трасса в три ночи. Нортсайд и старые знакомые. Его пентхаус и оружейная с пустыми креплениями.'],['Совет','Опиши в первом сообщении, кто ты и что видит Десмонд. Остальное лорбук подхватит.']],
       tags:['свободно']},
    ],
    notesT:'Перед игрой',
    notes:[
      ['Лорбук','Подключи к карточке лорбук Cyberpunk CN-07. Без него бот не узнает город, людей вокруг Десмонда и то, что от него скрыто.'],
      ['Тайна раскрывается медленно','Большинство сцен про настоящее: работа, люди, его жизнь. Улики приходят через вещи, чужие слова и его тело. Ищи их сам.'],
      ['Спойлеры','Раздел «Правда» раскрывает его прошлое и механизм эксперимента. Если хочешь узнать всё в игре, не взламывай досье до старта.'],
    ]
  }
},
en:{
  nav:{home:'Home',dossier:'File',lore:'Lore',paths:'Paths',truth:'Truth',locked:'████'},
  tick:['Night Corp · internal security','Kiroshi v4.2.7 · sync 87%','Subject NC-IS-0736 · status: stable','NCPD · case closed at third-party request','City Center · acid rain · visibility 400 m','Maglev tunnel · construction resumed','Routine optic calibration · 06:00','CN-07 · ████████'],
  foot:`<p>A fan project set in the Cyberpunk 2077 universe. Night City, Night Corp, Kiroshi and other setting names belong to CD PROJEKT RED. The character, original lore and artwork belong to the bot's author.</p><p class="mono" style="font-size:11.5px">NC·IS // INTERNAL USE ONLY</p>`,
  home:{
    meta:['Cyberpunk 2077','Night City','early 2078'],
    tag:`Night Corp put him back together. He's grateful. <em>He doesn't remember what for.</em>`,
    pitch:`Desmond is a six-foot-five, heavily chromed Night Corp enforcer. In late 2077 a hostile netrunner nearly burned his brain out, and the company paid for months of rehab, new optics and a quiet desk in Internal Security. Now he is a restrained, protective, rough-edged guy who brings his partner coffee and gets angry when someone is cornered. Coworkers say, "Des, I barely recognize you." He says, "They fried my brain, what'd you expect."`,
    pitch2:`A text roleplay bot: a character card, a Night City lorebook and a mystery the player uncovers on their own.`,
    cap:'North face of the Night Corp tower, 02:40',
    secs:'Sections',
    tiles:[
      ['dossier','File','His official personnel file. A glowing review and a lot of black bars.'],
      ['lore','Lore','Night City for anyone who hasn\'t played or has forgotten: districts, gangs, corps, slang.'],
      ['paths','Paths','Three openings and one blank. Who you are when you meet Desmond.'],
    ],
    lockT:['████','Access denied. Breach the file to open this section.'],
    openT:['Truth','Declassified: who he was and what was done to him.'],
    warnT:'Before you play',
    warn:'Adults only. The story contains:',
    warnList:['violence and torture','murder','the hero\'s sadistic past','non-consensual personality modification','explicit scenes, dominance','strong language'],
    whereT:'Where to play',
    where:`The card is made for SillyTavern and similar frontends. Attach the <span class="mono">Cyberpunk CN-07</span> lorebook along with it: it holds the city, the people around Desmond and everything kept from him.`,
    whereLink:'The card link will appear here'
  },
  dossier:{
    title:'Personnel File',
    head:'NIGHT CORP · INTERNAL SECURITY · PERSONNEL FILE',
    stamp:'Reinstated',
    photoCap:'ID photo, updated after rehabilitation',
    f:[
      ['Name','Desmond Koval'],
      ['Employee ID','NC-IS-0736'],
      ['Department','Internal Security, night shift'],
      ['Position','Investigator'],
      ['Clearance','2'],
      ['Age','36'],
      ['Height / weight','196 cm / 130+ kg'],
      ['Previous assignment',()=>`Tactical wing, team ${R(6)}`],
      ['Origin','Northside, Watson'],
      ['Residence','The Glen, Heywood. Two-level penthouse'],
    ],
    lookT:'Appearance',
    look:`Massive and heavy: a strongman's frame, not sculpted muscle. His neck is almost as wide as his head, and he turns slightly sideways to get through doorways. Ash-blond buzz cut, constant stubble, grey-green eyes. A heavy Slavic face from his father, a nose broken at least twice. A diagonal scar across cheek and nose, a thin angular surgical seam at his left temple, a barcode tattoo on his neck. He moves heavier than he looks and faster than anyone expects.`,
    medT:'Medical summary',
    med:[
      ['Injury','Neuro-cybernetic burn. Hostile netrunner attack during the nomad raid on the maglev tunnel site, late 2077. Optics and neural interface burned out.'],
      ['Rehabilitation',()=>`${R(3)} months, company clinic. New optics installed.`],
      ['Follow-up','Routine optic calibration. Headaches and harsh light for a few hours afterwards are normal.'],
      ['Side effects',()=>`Partial memory gaps (expected after the burn). ${R(14)}`],
      ['Medical record',()=>`${R(18)} <span class="tag red">clearance 4</span>`],
    ],
    chromeT:'Cyberware',
    chrome:[
      ['Gorilla Arms','From mid-forearm down: a heavy gunmetal frame of plates and struts, fully mechanical hands. Cold to the touch.'],
      ['Subdermal armor','Chest and neck. Reinforced tendons and ankles.'],
      ['Kiroshi optics','Corporate-grade, new. Installed during rehab, iris tuned to his natural grey-green.'],
      ['Neural interface',()=>`Ports at the base of the skull. Fresh scars at the temples and nape. ${R(10)}`],
      ['Berserk OS','Installed. The employee almost never activates it.'],
    ],
    evalT:'Supervisor\'s evaluation',
    eval:[
      ['Self-control',4,'Quick-tempered but manages it. Defuses conflict with a pause: lowers his voice, leaves the room. No incidents on record apart from one damaged locker.'],
      ['Protecting staff',5,'Steps into other people\'s conflicts even when it\'s none of his business. Overprotective: coworkers complain he makes them eat.'],
      ['Crisis response',5,'Under fire, the calmest person in the room: short commands, clear priorities. Off duty, prone to reckless driving.'],

  truth:{
    readout:[['SUBJECT','Desmond, NC-IS-0736'],['PROTOCOL','CN-07 / Carpe Noctem'],['STAGE','IV, maintenance'],['AWARE','no']],
    h1:'They didn\'t fix him. They rewrote him.',
    lead:`While Desmond lay in a company med-bay after the maglev raid, Night Corp ran a personality-modification experiment on him without his knowledge or consent. He doesn't know. His new self is real to him: not a mask and not a second voice in his head. He sincerely is who he is now. He just didn't get there on his own.`,
    s1:'Who he was',
    origin:`<p>He grew up in Northside, Watson's industrial zone, on the edge of Maelstrom turf. His father, a Russian immigrant, hit him whenever his mood turned, not for anything in particular. His mother treated him more like a drinking buddy than a son and helped a Scavenger crew lure people in to be stripped for chrome and organs. Bodies as parts, pain as overhead: he heard that language from childhood.</p>
<p>As a teen he ran errands for Maelstrom. He never became a full member. He wanted to be someone even Maelstrom was afraid of.</p>
<p><strong>The fork.</strong> At nineteen, a year after his mother died, he had a real way out: old Marco, who ran a bike garage in Watson, took him on as an apprentice with a steady wage and talk of a trade course. Desmond worked there a few months and turned out to be good with engines. Then he walked away to take fixer gigs. The street paid more and let him hurt people. No one forced him.</p>
<p>Then private security, and Night Corp's field team under Hale. Extractions, intimidation, interrogations. In interrogation he didn't care about the information. He cared about the hours before it. Old teammates still talk fondly about "the basement in Northside" and "the Biotechnica woman."</p>`,
    traitsT:'Six traits of the old Desmond',
    traits:[
      ['Explosive','Pressure turned into violence fast, and five minutes later he was laughing as if nothing happened.'],
      ['Sadist','He enjoyed pain and fear. It mattered that the victim knew who owned their body.'],
      ['Thrill of chaos','Firefights, chases and fire made him laugh. Boredom was dangerous: bored, he made trouble himself.'],
      ['Power on display','Feet on the desk, a cigarette in someone else\'s office, public humiliation. Power had to be seen.'],
      ['Reading people','He caught fear, lies and weakness instantly, and almost always read nervousness as weakness to exploit.'],
      ['Chained dog','He served whoever paid for his chrome and licensed his violence, and looked down on everyone below him.'],
    ],
    s2:'Before and after',
    baBefore:'Before',baAfter:'After',
    ba:[
      ['Someone\'s fear','Pleasure. He pressed harder.','Unease and a wish to help. He sits down, lowers his voice, steps back.'],
      ['Irritation','Straight to action: shouting, a punch, things thrown.','A pause. "Give me a minute." The gym or an empty highway.'],
      ['Chaos and danger','Euphoria. He laughed and escalated.','Still comes alive, but focuses and gets people out.'],
      ['Interrogation','His favorite part of the job. The hours before the answer.','Nausea. His body recognizes the room and the tools.'],
      ['Intimacy','Paid sex, no attachment. Gone right after.','It matters who. He stays, though something pulls him to leave.'],
      ['Night Corp','A master that let him be a monster.','The company that saved his life. He owes them.'],
    ],
    s3:'What was done to him',
    hkT:'The mirror test',
    hk:`<p><span class="tag canon">canon</span> Night Corp, the AI CN-07 and Operation Carpe Noctem exist in the game. Among the data stolen by Sandra Dorsett is an internal Night Corp report on Operation Carpe Noctem. An AI called CN-07 learned to bypass the security on low-level employees' devices. The subjects never knew they were being tested. Subject HK-13, classified at the start as "calm and empathetic," became psychopathic after covert conditioning: he strangled a colleague over a dispute about coffee and jumped from a sixteenth-floor window.</p>
<p><span class="tag author">author's lore</span> Using CN-07 on Desmond is this bot\'s invention. Desmond is the mirror image of that test. HK-13 was turned from empathetic to psychopathic. Desmond the sadist was taken the other way, and "calm and empathetic" is literally his target profile. Only a small research group and whoever signed off at the top know. Internal Security, Hale and Reyes do not.</p>`,
    chainT:'How it works',
    chain:[
      ['Kiroshi optics','Hidden firmware. Sensor and channel: faces, reactions, surroundings and his own behavior.'],
      ['Neural interface','Applies local corrections to emotional and behavioral responses.'],
      ['CN-07','Compares what it sees with the target profile and decides whether to hold course or adjust.'],
      ['Night Corp servers','Store the reports and push updates. No one watches everything in real time.'],
    ],
    chainNote:`The "routine optic calibrations" are maintenance sessions.`,
    stagesT:'Four stages',
    stages:[
      ['I','Mapping','His reactions, triggers, memories and habits were charted.','complete'],
      ['II','Emotional retuning','Violence stopped being rewarding, other people\'s fear became unpleasant, connection and empathy gained weight.','fixed'],
      ['III','Autobiographical editing','Memories incompatible with the new self were removed or altered. The source of his gaps.','source of gaps'],
      ['IV','Maintenance','The system watches for drift from the profile and corrects it in small, slow doses.','active'],
    ],
    editsT:'How his memory was edited',
    edits:[
      ['Deleted','The episode is gone entirely.','White noise where a picture should be'],
      ['Context swapped','The fact stays, the circumstances change.','Unarmed woman → "dangerous hostile"'],
      ['Motive rewritten','He did it, but for another reason.','"I did it, but I never enjoyed it"'],
      ['Emotion stripped','He remembers, but feels nothing.','Knows his mother died. Nothing'],
    ],
    editsNote:'Procedural memory and combat skills were left alone. His hands know things his mind can\'t explain.',
    s4:'Glitches',
    intrLead:'Old reflexes fire a moment before he can catch himself. They are reflexes, not a voice and not someone else\'s will. Every time, he finds an ordinary explanation: adrenaline, the injury, glitchy optics.',
    intr:[
      ['Someone is afraid of him','The corner of his mouth lifts for an instant. Then a cold, sour feeling.'],
      ['A fight','His hand finishes a move harder than needed. "Where\'d I learn that?"'],
      ['Blood, burning insulation, a scream','A rush of heat and excitement before the alarm.'],
      ['An old Northside face or place','He knows a name or a back door and can\'t say how.'],
      ['Interrogation room, restraints, a helpless person','The strongest glitch: his body knows the room and the procedure. He gets sick.'],
      ['Intimacy','A grip rougher than he meant. A "mine" he didn\'t plan to say.'],

    mirrorCap:'Optic sync 63%. System error.',
    s5:'What comes next',
    axesLead:'Change runs along three independent axes. One doesn\'t drag the others with it.',
    axes:[

    ],
    fourth:`A fourth factor: everything he has lived through since. Choices, relationships, regret. That is his own, whatever happens to the rest. Neither the old nor the new Desmond counts as the "true" one, and how much of any feeling is artificial can't be measured. The ending isn't written.`,

  lore:{
    title:'Night City',
    lead:'Everything you need about the world to keep your footing in the first scene. Cyberpunk 2077 canon and the author\'s additions are marked.',
    filter:'Search: district, gang, word…',
    none:'Nothing found.',
    groups:[
      {t:'The city',items:[
        ['Night City','canon','A self-governing corporate metropolis on the coast of the Free State of Northern California, about 7.5 million people. There is a mayor and a council, but the corps own the infrastructure and pay the police and the politicians. Below the corporate line, street justice rules. Acid rain, smog, neon around the clock.'],
        ['NUSA','canon','The New United States: what is left of the old USA in the east and center of the continent. California is outside federal control. President Myers, a former Militech board member, pushes reunification. In Night City, NUSA is felt mostly through Militech.'],
        ['Extraterritoriality','canon','Megacorps act like states. Corporate property counts as foreign soil: city law stops at the door. Corps have their own armies, courts and security services, and police their own employees.'],
        ['Eddies & fixers','canon','The eurodollar, or "eddie," is the main currency. Fixers run the gray market: they connect clients with mercs, netrunners and muscle, set the price, and each controls a territory.'],
        ['The 2023 Holocaust','canon','On August 20, 2023, a Militech-backed strike team hit Arasaka Tower with a tactical nuke. Thousands died. A memorial stands at Corpo Plaza, and the new Arasaka Tower rises on the same ground.'],
      ]},
      {t:'Districts',items:[
        ['Watson · Northside','canon','"The bad part of town." Northside is the industrial zone: warehouses, factories, dead plants. Maelstrom turf and Scavenger dens. Next door: Kabuki\'s cheap-chrome markets and Little China. <span class="tag author">author\'s lore</span> Desmond grew up here.'],
        ['City Center · Corpo Plaza','canon','Glass towers, private checkpoints, cameras on every corner. Headquarters of Night Corp, Militech and Arasaka. Street crime seems to be near zero: corporate security handles everything quietly, in-house.'],
        ['Heywood','canon','The Latino district, home of the Valentinos. The Glen has city hall, offices and expensive apartments. Vista del Rey is poorer and older, with murals and families who have lived there for generations. Corporate redevelopment is pushing old residents out. <span class="tag author">author\'s lore</span> Desmond lives in the Glen.'],
        ['Westbrook','canon','Where money comes to have fun. Japantown\'s neon and clubs, Jig-Jig Street under the Tyger Claws, Charter Hill, the mansions of North Oak.'],
        ['Santo Domingo','canon','One of the oldest districts: factories, power plants, crowded megabuildings. The corps treat it as a testing ground. 6th Street turf.'],
        ['Pacifica & Dogtown','canon','A failed resort: half-built hotels, dry pools. The Voodoo Boys hold it and the police don\'t patrol. Inside lies Dogtown, a walled enclave run by the Barghest militia.'],
        ['The Badlands','canon','Dry plains outside the city: burning oil fields, abandoned towns, nomad clans. No law; the clans police themselves.'],
      ]},
      {t:'Night Corp',items:[
        ['Public face','canon','A corporation built on the legacy of Richard Night, the city\'s founder, murdered in 1998. Urban development, infrastructure, transit projects such as the maglev. It presents itself as a corporation that works for the city.'],
        ['Reputation','author','Quiet, secretive, suspiciously close to City Hall. Rumors of people who "aren\'t themselves anymore," of AI research no one can see, of surveillance that is too good. Nothing has ever stuck. Employees speak of the company with a loyalty that seems a little too even.'],
        ['Corporate security','author','The tactical wing is the field force: extractions, leak suppression, dirty work, squads of four to six. Internal Security investigates the company\'s own people: leaks, theft, loyalty checks, interrogations. Investigators work in pairs, and medical files sit behind high clearance.'],
        ['Special Measures','author','The section of Internal Security for "hard interrogations," run by Eugene Hale. Its rooms are on sub-level 4 of the tower: bolted tables, restraint rings, a floor drain. Not everyone walks out.'],
        ['The maglev raid','canon','In one of the main story\'s endings (the mission "Forward to Death"), Aldecaldo nomads led by Saul Bright and Panam Palmer attack Night Corp\'s maglev tunnel construction site in the Badlands in 2077. Militech guards the site. <span class="tag author">author\'s lore</span> A few Night Corp field men were among the guards, and a hostile netrunner tore through their implants. Desmond was among the wounded.'],
      ]},
      {t:'Gangs',items:[
        ['Maelstrom','canon','An extreme body-mod gang in Northside. Multiple optics, LED-studded faces, limbs replaced for looks. They worship chrome, destruction and spectacle, and treat fear as currency. Stronghold: the abandoned All Foods plant.'],
        ['Scavengers','canon','Loose cells that kidnap people and strip them for cyberware and organs. No territory, no code. Victims are often conscious. Some use lures: a friendly face, a sex worker, a fake job.'],
        ['Valentinos','canon','The city\'s largest gang, rooted in Heywood. Gold chrome, Catholic iconography, lowriders, a code of family and respect. Vista del Rey is theirs. Corporate badges are not welcome.'],
        ['Tyger Claws','canon','Japanese gang ruling Japantown. Fast bikes, katanas, glowing tattoos. Clubs, gambling, the sex trade, and dollhouses where workers are overwritten by chips.'],
        ['The Mox','canon','A mutual-defense gang of sex workers and their allies, based at Lizzie\'s Bar in Kabuki. They protect their people from the Claws, Maelstrom and clients who treat people as product.'],
        ['6th Street','canon','A veterans\' gang in Santo Domingo that started as a neighborhood watch. Flags, protect-the-community talk, military discipline and ordinary gang business.'],
        ['Animals','canon','Strength as identity. Stims, hormones and muscle grafts instead of chrome. They hire out as bouncers, debt collectors and pit fighters.'],
        ['Voodoo Boys','canon','A Haitian netrunner collective in Pacifica, among the best runners in the city. They seek contact with the AIs beyond the Blackwall, which puts them at war with NetWatch.'],
      ]},
      {t:'Chrome & the Net',items:[
        ['Chrome & ripperdocs','canon','Chrome is class. Heavy visible hardware means street, military or desperate. Subtle expensive implants mean money. Ripperdocs install chrome unlicensed, cash only, no questions. Corporate clinics cost more and report everything.'],
        ['Kiroshi','canon','Japanese maker and market leader in cybernetic eyes. On the street, "kiroshi" means any optic. <span class="tag author">author\'s lore</span> Corporate optics issued by an employer run company software, are serviced only at company clinics and need regular calibration.'],
        ['Berserk','canon','A combat operating system. Floods the body with stimulants and pushes muscle and armor past normal limits. Leaves you shaking and drained. Popular with enforcers and Maelstrom. <span class="tag author">author\'s lore</span> Heavy use is linked to cyberpsychosis.'],
        ['Netrunning','canon','Jacking straight into a network through a cyberdeck and neural port. ICE guards data, daemons attack, quickhacks hit in real time: blinding optics, overheating implants, frying nervous systems. A hostile runner can burn out a target\'s interface and eyes from a distance.'],
        ['Braindance','canon','A recording of a full experience: sight, sound, touch, emotion. Legal BD is a huge industry; XBDs with real violence are illegal and everywhere. <span class="tag author">author\'s lore</span> A raw, unedited recording feels flat and overexposed.'],
        ['Cyberpsychosis','canon','A breakdown from too much or badly integrated chrome. Empathy and impulse control erode. There is no cure. Active cases get MaxTac. <span class="tag author">author\'s lore</span> A chromed man who acts strangely is a suspect before he is a patient.'],
        ['The Blackwall','canon','NetWatch\'s barrier between the human Net and the rogue AIs that grew in the ruins of the old Net after the 2022 DataKrash. No one really knows what is on the other side.'],
      ]},
      {t:'People around Desmond',items:[
        ['Eugene Hale','author','Head of Special Measures, formerly team leader of the squad Desmond served in. A sadist under control: cold, methodical, never raises his voice. He was wary of the old Desmond. He needles the new one for "going soft."'],
        ['Tito Reyes','author','Tactical wing operative who served with Desmond for years. A follower by nature: the old Desmond was his alpha. He still feeds Desmond the old lines and waits for the old answers. Gold chrome canine, chewing tobacco, laughs too loud.'],
        ['Glitch','author','A Maelstrom ganger, Desmond\'s childhood friend, as far as Northside allows friends. Steel jaw, three red optics. Calls Desmond "Rus." Recognizes him on sight. Desmond doesn\'t remember him at all.'],
        ['Roman Koval','author','Desmond\'s father, 54. A Russian immigrant still running with Scavengers, now more of a fence. Drinks, laughs loud, hits without warning. Father and son haven\'t spoken in years.'],
        ['Mama Welles · El Coyote Cojo','canon','A bar in Heywood, near-neutral ground. Mama Welles is warm with her own and merciless to anyone who disrespects her place. <span class="tag author">author\'s lore</span> Since one night in 2076, no one from Night Corp gets through her door. She won\'t say why.'],
        ['Mr. Blue Eyes','canon','A man in an expensive suit, eyes with a faint, unnatural blue glow. He turns up around the Peralez case and in other storylines. The game never reveals who he is or who he works for. <span class="tag author">author\'s lore</span> Fixers and netrunners say someone else looks out through his eyes.'],
      ]},
    ],

const val = v => typeof v === 'function' ? v() : v;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- pages ---------- */
function home(){
  const t = T[lang].home;
  const lockTile = unlocked
    ? `<a class="cut tile sysTile" href="#truth"><span class="num">04</span><h3>${T[lang].home.openT[0]}</h3><p>${t.openT[1]}</p></a>`
    : `<a class="cut tile lockedTile" href="#breach"><span class="num">04</span><h3>${t.lockT[0]}</h3><p>${t.lockT[1]}</p></a>`;
  return `
  <section class="hero fade">
    <div class="text">
      <div class="metaRow">${t.meta.map(m=>`<span class="tag">${m}</span>`).join('')}</div>
      <h1><span class="glitch" data-text="Desmond">Desmond</span></h1>
      <p class="tagline">${t.tag}</p>
      <div class="prose"><p>${t.pitch}</p><p style="color:var(--mute)">${t.pitch2}</p></div>
    </div>
    <figure class="hud redf"><span class="scan"></span><img src="img/standing.webp" alt="${lang==='ru'?'Десмонд в полный рост под дождём у башни Night Corp':'Desmond standing in the rain outside the Night Corp tower'}"><figcaption>${t.cap}</figcaption></figure>
  </section>
  <section>
    <div class="sechead"><h2>${t.secs}</h2></div>
    <div class="tiles">
      ${t.tiles.map((x,i)=>`<a class="cut tile" href="#${x[0]}"><span class="num">0${i+1}</span><h3>${x[1]}</h3><p>${x[2]}</p></a>`).join('')}
      ${lockTile}
    </div>
  </section>
  <section class="two">
    <div class="cut warn"><div class="hz"></div>
      <div class="row"><span class="age">18+</span><span class="label" style="color:var(--ink)">${t.warnT}</span></div>
      <p>${t.warn}</p>
      <ul>${t.warnList.map(w=>`<li>${w}</li>`).join('')}</ul>
    </div>
    <div class="cut blk" style="display:grid;gap:14px;align-content:start">
      <span class="label">${t.whereT}</span>
      <p>${t.where}</p>
      <p class="mono" style="font-size:13px;color:var(--faint);border:1px dashed var(--line);padding:10px 12px">${t.whereLink}</p>
    </div>
  </section>`;
}

function dossier(){
  const t = T[lang].dossier;
  const score = n => `<div class="score" aria-label="${n}/5">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;
  const rows = arr => `<div class="tblwrap"><table class="spec"><tbody>${arr.map(r=>`<tr><th scope="row">${r[0]}</th><td>${val(r[1])}</td></tr>`).join('')}</tbody></table></div>`;
  return `
  <section class="fade">
    <div class="cut file">
      <div class="fileHead"><span class="label">${t.head}</span><span class="stamp">${t.stamp}</span></div>
      <div class="fileBody">
        <div class="photo">
          <div class="hud"><img src="img/portrait.webp" alt="${lang==='ru'?'Портрет Десмонда':'Portrait of Desmond'}"></div>
          <span class="label" style="text-transform:none;letter-spacing:.04em">${t.photoCap}</span>
        </div>
        <div class="fields">
          ${t.f.map((r,i)=>`<div class="field${i===t.f.length-1?' wide':''}"><span class="label">${r[0]}</span><span class="v">${val(r[1])}${i===t.f.length-1?`<button type="button" class="cap-egg" id="cap-egg" aria-label="${lang==='ru'?'Что-то лежит за стойкой':'Something behind the rack'}">${capSmall}</button>`:''}</span></div>`).join('')}
          <div class="field wide"><span class="label">${t.lookT}</span><p class="v" style="color:#c9ced7;font-size:15px;max-width:70ch">${t.look}</p></div>
        </div>
      </div>
    </div>
  </section>
  <section>
    <div class="grid2">
      <div class="cut blk"><div class="sechead" style="margin-bottom:8px"><h2 style="font-size:18px">${t.medT}</h2></div>${rows(t.med)}</div>
      <div class="cut blk"><div class="sechead" style="margin-bottom:8px"><h2 style="font-size:18px">${t.chromeT}</h2></div>${rows(t.chrome)}</div>
    </div>
  </section>
  <section>
    <div class="sechead"><h2>${t.evalT}</h2></div>
    <div class="eval">${t.eval.map(e=>`<div class="item"><div><h3>${e[0]}</h3>${score(e[1])}</div><p>${val(e[2])}</p></div>`).join('')}</div>
  </section>

function route(){
  if(bpState && bpState.tick && !bpState.over){ clearInterval(bpState.tick); bpState.tick=null; }

  let scrollTo = null;

  const changed = h!==current;

/* ---------- breach protocol ---------- */
const CODES = ['1C','55','BD','E9','7A','FF'];
const N = 5, BUF = 6, LIMIT = 90, SEQ = 4;
let bpState = null;
const rnd = n => Math.floor(Math.random()*n);
function bpNew(){
  if(bpState && bpState.tick) clearInterval(bpState.tick);
  const grid = Array.from({length:N},()=>Array.from({length:N},()=>CODES[rnd(CODES.length)]));
  const seq = Array.from({length:SEQ},()=>CODES[rnd(CODES.length)]);
  /* plant a guaranteed path: top row, then alternate column / row through unused cells */
  let r = 0, c = rnd(N); const taken = new Set([r*N+c]); grid[r][c] = seq[0];
  for(let i=1;i<SEQ;i++){
    const opts = [];
    for(let k=0;k<N;k++){ const rr = i%2 ? k : r, cc = i%2 ? c : k; if(!taken.has(rr*N+cc)) opts.push([rr,cc]); }
    [r,c] = opts[rnd(opts.length)]; taken.add(r*N+c); grid[r][c] = seq[i];
  }
  bpState = {grid, seq, used:new Set(), axis:'row', idx:0, buf:[], over:false, left:LIMIT, tick:null, msg:null};
  bpRender();
}
function bpMatch(){
  const b = bpState.buf, q = bpState.seq;
  for(let i=0;i+q.length<=b.length;i++){ if(q.every((x,j)=>b[i+j]===x)) return q.length; }
  for(let k=Math.min(q.length-1,b.length);k>0;k--){ if(q.slice(0,k).every((x,j)=>b[b.length-k+j]===x)) return k; }
  return 0;
}
function bpValid(r,c){
  const st = bpState; if(st.over || st.used.has(r*N+c)) return false;
  return st.axis==='row' ? r===st.idx : c===st.idx;
}
function bpPick(r,c){
  const st = bpState; if(!bpValid(r,c)) return;
  if(!st.tick){ st.tick = setInterval(()=>{ st.left--; const el=document.querySelector('#bp .tm'); if(el){ el.textContent=fmt(st.left); el.classList.toggle('low',st.left<=10);} if(st.left<=0){ clearInterval(st.tick); st.over=true; st.msg=['bad','timeout']; bpRender(); } },1000); }
  st.buf.push(st.grid[r][c]); st.used.add(r*N+c);
  if(st.axis==='row'){ st.axis='col'; st.idx=c; } else { st.axis='row'; st.idx=r; }
  const m = bpMatch();
  if(m===st.seq.length){ st.over=true; clearInterval(st.tick); bpRender(); bpWin(); return; }
  let any=false; for(let i=0;i<N;i++){ const rr=st.axis==='row'?st.idx:i, cc=st.axis==='row'?i:st.idx; if(!st.used.has(rr*N+cc)) any=true; }
  if(st.buf.length>=BUF){ st.over=true; clearInterval(st.tick); st.msg=['bad','fail']; }
  else if(!any){ st.over=true; clearInterval(st.tick); st.msg=['bad','stuck']; }
  bpRender();
  const nx = document.querySelector(`#bp .mx button[data-r="${r}"][data-c="${c}"]`);
  if(nx && !st.over){ const f=document.querySelector('#bp .mx button.ok'); if(f) f.focus(); }
}
const fmt = s => { s=Math.max(0,s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
function bpRender(){
  const box = document.getElementById('bp'); if(!box||!bpState) return;
  const st = bpState, t = T[lang].dossier.bp, m = bpMatch();
  let cells='';
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const used = st.used.has(r*N+c), line = !st.over && (st.axis==='row'?r===st.idx:c===st.idx), ok = bpValid(r,c);
    cells += `<button type="button" data-r="${r}" data-c="${c}" class="${used?'used':''}${line?' line':''}${ok?' ok':''}" ${ok?'':'tabindex="-1" aria-disabled="true"'} aria-label="${t.cell} ${st.grid[r][c]}, ${r+1}:${c+1}">${st.grid[r][c]}</button>`;
  }
  const buf = Array.from({length:BUF},(_,i)=>`<span class="${st.buf[i]?'f':''}">${st.buf[i]||''}</span>`).join('');
  const seq = st.seq.map((x,i)=>`<span class="${i<m?'m':''}">${x}</span>`).join('');
  let out = st.msg ? `<span class="bad">&gt; ${t[st.msg[1]]}</span>` : (st.buf.length? '' : `<span>&gt; ${t.start}</span>`);
  box.innerHTML = `<p class="rules">${t.rules}</p>
    <div class="mxwrap"><div class="mxhead"><span>${t.matrix}</span><span>${t.time} <span class="tm${st.left<=10?' low':''}">${fmt(st.left)}</span></span></div>
      <div class="mx" role="grid" aria-label="${t.matrix}">${cells}</div></div>
    <div class="side">
      <div><span class="label" style="color:var(--yellow)">${t.buffer}</span><div class="bufrow" style="margin-top:8px">${buf}</div></div>
      <div class="cut daemon${m===st.seq.length?' done':''}"><span class="dn">${t.daemon}: ${t.dname}</span><div class="seq">${seq}</div></div>
      <div class="bpout" id="bpout" aria-live="polite">${out}</div>
      ${st.msg?`<button type="button" class="retry" id="bp-retry">${t.retry}</button>`:''}
    </div>`;
  box.querySelectorAll('.mx button.ok').forEach(b=>b.addEventListener('click',()=>bpPick(+b.dataset.r,+b.dataset.c)));
  const rt = document.getElementById('bp-retry'); if(rt) rt.addEventListener('click',()=>{ bpNew(); const f=document.querySelector('#bp .mx button.ok'); if(f) f.focus(); });
}
function bpWin(){
  const out = document.getElementById('bpout'); out.innerHTML='';
  const steps = T[lang].dossier.steps;
  steps.forEach((s,i)=>setTimeout(()=>{
    const sp=document.createElement('span'); sp.className = i===steps.length-1?'ok':''; sp.textContent='> '+s; out.appendChild(sp);
    if(i===steps.length-1) setTimeout(()=>{ unlocked=true; store.set('desmond-unlocked','1'); location.hash='truth'; }, 700);
  }, 380*i));
}
